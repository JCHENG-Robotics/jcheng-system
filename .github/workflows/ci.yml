name: system-ci

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m1-gate:
    name: m1-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Repository gate
        shell: bash
        run: bash scripts/check_repo_gate.sh

  m3-mock:
    name: m3-mock
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ros:humble-ros-base@sha256:dfc94c85d8e01f230951b2a85ca5576e08473081c3da5fbbe8f3ab844703b9ba
    env:
      DEBIAN_FRONTEND: noninteractive
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Install git for checkout
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: M3 gate
        shell: bash
        run: bash scripts/check_m3_gate.sh
      - name: Install build and test dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-colcon-common-extensions \
            python3-pip \
            python3-setuptools \
            python3-yaml \
            ros-humble-ament-cmake \
            ros-humble-builtin-interfaces \
            ros-humble-geometry-msgs \
            ros-humble-rosidl-default-generators \
            ros-humble-rosidl-default-runtime \
            ros-humble-std-msgs
          python3 -m pip install --no-cache-dir 'pytest==8.3.4'
      - name: Fetch pinned interfaces
        shell: bash
        run: |
          git clone --depth 1 --branch v0.1.0 \
            https://github.com/JCHENG-Robotics/jcheng-interfaces.git \
            /tmp/jcheng-interfaces
          cp -r /tmp/jcheng-interfaces/ros2_ws/src/jcheng_interfaces ros2_ws/src/
      - name: Build interface and system packages
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build \
            --base-paths ros2_ws/src \
            --event-handlers console_cohesion+
      - name: Contract and mock scenarios
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          python3 -m pytest -q
          ros2 run jcheng_testkit jcheng_scenarios --root . --out e2e/reports/m3-mock.json
          python3 tools/verify_lock.py \
            --root . \
            --remote \
            --interfaces-root /tmp/jcheng-interfaces \
            --require-evidence
      - name: Upload M3 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-mock-report
          path: e2e/reports/m3-mock.json
          if-no-files-found: ignore

  m4-readonly:
    name: m4-readonly
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ros:humble-ros-base@sha256:dfc94c85d8e01f230951b2a85ca5576e08473081c3da5fbbe8f3ab844703b9ba
    env:
      DEBIAN_FRONTEND: noninteractive
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Install git for checkout
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install build and test dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-colcon-common-extensions \
            python3-pip \
            python3-setuptools \
            python3-yaml \
            ros-humble-ament-cmake \
            ros-humble-builtin-interfaces \
            ros-humble-geometry-msgs \
            ros-humble-rclpy \
            ros-humble-rosidl-default-generators \
            ros-humble-rosidl-default-runtime \
            ros-humble-sensor-msgs \
            ros-humble-std-msgs \
            ros-humble-tf2-msgs
          python3 -m pip install --no-cache-dir 'pytest==8.3.4'
      - name: M4 read-only gate
        shell: bash
        run: bash scripts/check_m4_readonly.sh
      - name: Fetch pinned interfaces
        shell: bash
        run: |
          git clone --depth 1 --branch v0.1.0 \
            https://github.com/JCHENG-Robotics/jcheng-interfaces.git \
            /tmp/jcheng-interfaces
          cp -r /tmp/jcheng-interfaces/ros2_ws/src/jcheng_interfaces ros2_ws/src/
      - name: Build interface and system packages
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build \
            --base-paths ros2_ws/src \
            --event-handlers console_cohesion+
      - name: Read-only tests and short probe
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          python3 -m pytest -q
          ros2 run jcheng_telemetry jcheng_readonly_probe \
            --root . \
            --duration-s 3 \
            --interval-s 0.2 \
            --out e2e/reports/m4-readonly.json \
            --evidence e2e/reports/m4-readonly.jsonl \
            --max-gap-s 1.0
          bash scripts/check_m4_readonly.sh
      - name: Upload M4 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-readonly-report
          path: |
            e2e/reports/m4-readonly.json
            e2e/reports/m4-readonly.jsonl
          if-no-files-found: ignore

  m5-mock:
    name: m5-mock
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ros:humble-ros-base@sha256:dfc94c85d8e01f230951b2a85ca5576e08473081c3da5fbbe8f3ab844703b9ba
    env:
      DEBIAN_FRONTEND: noninteractive
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Install git for checkout
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install build and test dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-colcon-common-extensions \
            python3-pip \
            python3-setuptools \
            python3-yaml \
            ros-humble-ament-cmake \
            ros-humble-builtin-interfaces \
            ros-humble-geometry-msgs \
            ros-humble-rclpy \
            ros-humble-rosidl-default-generators \
            ros-humble-rosidl-default-runtime \
            ros-humble-std-msgs
          python3 -m pip install --no-cache-dir 'pytest==8.3.4'
      - name: Fetch pinned interfaces
        shell: bash
        run: |
          git clone --depth 1 --branch v0.1.0 \
            https://github.com/JCHENG-Robotics/jcheng-interfaces.git \
            /tmp/jcheng-interfaces
          cp -r /tmp/jcheng-interfaces/ros2_ws/src/jcheng_interfaces ros2_ws/src/
      - name: Build interface and system packages
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build \
            --base-paths ros2_ws/src \
            --event-handlers console_cohesion+
      - name: M5.1 Mock transport tests
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          python3 -m pytest -q
          python3 -m pytest -q tests_ros
          bash scripts/check_m5_mock.sh

  m5-vendor:
    name: m5-vendor
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ros:humble-ros-base@sha256:dfc94c85d8e01f230951b2a85ca5576e08473081c3da5fbbe8f3ab844703b9ba
    env:
      DEBIAN_FRONTEND: noninteractive
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Install git for checkout
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install build and test dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-colcon-common-extensions \
            python3-pip \
            python3-setuptools \
            python3-yaml \
            ros-humble-ament-cmake \
            ros-humble-builtin-interfaces \
            ros-humble-geometry-msgs \
            ros-humble-rclpy \
            ros-humble-rosidl-default-generators \
            ros-humble-rosidl-default-runtime \
            ros-humble-std-msgs
          python3 -m pip install --no-cache-dir 'pytest==8.3.4'
      - name: Fetch pinned interfaces
        shell: bash
        run: |
          git clone --depth 1 --branch v0.1.0 \
            https://github.com/JCHENG-Robotics/jcheng-interfaces.git \
            /tmp/jcheng-interfaces
          cp -r /tmp/jcheng-interfaces/ros2_ws/src/jcheng_interfaces ros2_ws/src/
      - name: Build interface and system packages
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build \
            --base-paths ros2_ws/src \
            --event-handlers console_cohesion+
      - name: M5.2 vendor static and executor tests
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          python3 -m pytest -q
          python3 -m pytest -q tests_ros
          bash scripts/check_m5_vendor.sh

  m6-replay:
    name: m6-replay
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install test dependencies
        shell: bash
        run: python3 -m pip install --no-cache-dir 'pytest==8.3.4' 'PyYAML==6.0.2'
      - name: S13 replay and S17 plan-only tests
        shell: bash
        run: |
          python3 -m pytest -q tests/test_replay.py tests/test_moveit_plan_only.py
          bash scripts/check_m6_replay.sh
          bash scripts/check_m6_moveit.sh
